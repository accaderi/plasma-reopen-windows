# Settings for plasma-reopen-windows. Uncomment to change.
[general]
# Ask before closing all apps (yes / no)
#confirm = yes
# Put windows back on their screen, position and size after login:
# yes / no / auto (= no when the KWin script "Remember Window Positions" is on,
# so the two do not fight over the windows)
#place_windows = auto
# Seconds an app may take to close before the shutdown is cancelled
#close_timeout = 30
# Seconds to wait for windows to appear after login
#restore_timeout = 120
# Saved sessions older than this are not restored
#max_age_days = 7
# App ids to leave alone (as shown by: plasma-reopen-windows windows), space separated
#exclude = org.qbittorrent.qBittorrent
# Put windows back in the same order on top of each other (yes / no)
#restore_stacking = yes
