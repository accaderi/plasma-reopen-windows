# Settings for plasma-reopen-windows.
#
# Every line starting with "#name =" shows the default; remove the "#" and
# change the value to override it, or use: plasma-reopen-windows config set NAME VALUE
# Running the installer again keeps your values and refreshes these comments.

[general]

# === Saving ====================================================================

# confirm - Ask before closing all apps. Show a dialog listing the open apps
# before Save & Shut Down / Restart closes them.
#   Values: yes / no.   Default: yes
#confirm = yes

# close_timeout - Seconds an app may take to close. If an app is still open
# after this (often because it asks to save something), the shutdown is
# cancelled and the apps closed so far are opened again. DaVinci Resolve
# always gets 120 s.
#   Values: 5-600.   Default: 30
#   Change it when: an app regularly needs longer to close.
#close_timeout = 30

# exclude - Apps to leave alone. App ids, space separated, as shown by:
# plasma-reopen-windows windows. They are neither closed nor started again.
#   Values: space-separated list.   Default: (empty)
#   Example: org.qbittorrent.qBittorrent
#exclude = 

# === Restoring =================================================================

# place_windows - Put windows back in place. Screen, position, size, desktop,
# minimized/maximized. auto = when the KWin script "Remember Window Positions"
# is on, leave the apps it handles to it and place the others (its blacklist,
# for example System Settings) here, so the two never move the same window.
#   Values: auto / yes / no.   Default: auto
#   Change it when: you want this tool to place windows although that script
#   is on (then turn the script off).
#place_windows = auto

# restore_stacking - Restore the window order. Put windows back in the same
# order on top of each other, on every screen.
#   Values: yes / no.   Default: yes
#restore_stacking = yes

# restore_timeout - Seconds to wait for windows after login. Windows that
# appear later are not placed.
#   Values: 10-900.   Default: 120
#   Change it when: slow apps (large projects) take longer than 2 minutes to
#   open.
#restore_timeout = 120

# max_age_days - Oldest session to restore (days). A saved session older than
# this is ignored at login.
#   Values: 1-365.   Default: 7
#max_age_days = 7

# === Login =====================================================================

# on_login - What comes back at login. last = the session saved by Save & Shut
# Down / Restart (if there is one); ask = a notification with the choices
# (last session, a profile, nothing); profile:NAME = always load that profile;
# nothing = start empty.
#   Values: last / ask / nothing / profile:NAME.   Default: last
#   Example: profile:Work
#on_login = last

# ask_timeout - Seconds to answer the login question. With on_login = ask:
# without an answer, the last session is restored (or nothing, if there is
# none).
#   Values: 5-300.   Default: 20
#ask_timeout = 20

# === Profiles ==================================================================

# profile_load - What loading a profile does. unite = start the profile's apps
# that are not open and arrange all its windows, closing nothing; switch =
# first save what is open as profile "Before NAME", close the apps that are
# not in the profile, then unite. Both are always available as separate
# commands too.
#   Values: unite / switch.   Default: unite
#profile_load = unite
